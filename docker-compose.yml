# Mokhetle Attorneys Inc. — local WordPress stack.
#
# One command to run the whole site locally:
#
#     docker compose up -d
#     ./export/setup.sh        # installs WP + activates the theme (auto-seeds pages/menu/front page)
#
# Then open http://localhost:8080  (admin: http://localhost:8080/wp-admin — admin / mokhetle-admin)
#
# The theme is bind-mounted, so edits under
# wp-content/themes/mokhetle-attorneys/ are reflected live.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mokhetle
      MARIADB_USER: mokhetle
      MARIADB_PASSWORD: mokhetle
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: mokhetle
      WORDPRESS_DB_PASSWORD: mokhetle
      WORDPRESS_DB_NAME: mokhetle
    volumes:
      - wp_data:/var/www/html
      # Live-mount the theme so local edits show immediately.
      - ./wp-content/themes/mokhetle-attorneys:/var/www/html/wp-content/themes/mokhetle-attorneys

  # wp-cli container (shares WordPress's files + network) for scripted setup/export.
  cli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: mokhetle
      WORDPRESS_DB_PASSWORD: mokhetle
      WORDPRESS_DB_NAME: mokhetle
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/mokhetle-attorneys:/var/www/html/wp-content/themes/mokhetle-attorneys
      - ./export:/export
    user: "33:33"
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_data:
